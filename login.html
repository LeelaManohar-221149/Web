<!DOCTYPE html>
<html>
<head>
    <title>Login Page | NGO Portal</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
        }

        .split-layout {
            display: flex;
            min-height: 100vh;
        }

        .image-half {
            flex: 1;
            background: url('images/volunteer_group.png') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-half::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(37, 99, 235, 0.4), rgba(17, 24, 39, 0.8));
        }

        .image-text {
            position: relative;
            z-index: 1;
            color: #ffffff;
            text-align: center;
            padding: 40px;
        }

        .image-text h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .image-text p {
            font-size: 20px;
            opacity: 0.9;
        }

        .form-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 40px;
        }

        .loginbox {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loginbox h2 {
            margin-bottom: 30px;
            color: #111827;
            font-size: 28px;
            font-weight: 700;
            margin-top: 0;
        }

        .input-box {
            margin: 20px 0;
            text-align: left;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: #111827;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            padding: 14px;
            flex: 1;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-login {
            background: #2563eb;
            color: white;
        }

        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-signup {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            box-shadow: none;
        }

        .btn-signup:hover {
            background: #f9fafb;
        }

        .google-btn {
            margin-top: 20px;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #374151;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .google-btn:hover {
            background: #f9fafb;
        }

        .forgot {
            font-size: 14px;
            margin-top: 15px;
            text-align: right;
        }
        
        .forgot a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot a:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e5e7eb;
            margin: 30px 0;
        }

        .register-link {
            text-align: center;
            color: #6b7280;
            font-size: 15px;
            margin-top: 25px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
            }
            .image-half {
                min-height: 30vh;
            }
        }
    </style>
</head>

<body>

<div class="split-layout">
    <div class="image-half">
        <div class="image-text">
            <h1>Welcome Back</h1>
            <p>Every login helps us orchestrate more impact across communities.</p>
        </div>
    </div>
    
    <div class="form-half">
        <div class="loginbox">
            <h2>Sign in to your account</h2>

            <form action="login_process.php" method="POST">
                <div class="input-box">
                    <input type="text" name="username" id="username" placeholder="Email address" required>
                </div>

                <div class="input-box">
                    <input type="password" name="password" id="password" placeholder="Password" required>
                </div>
                
                <div class="forgot">
                   <a href="forgot_password.html">Forgot password?</a>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-login">Sign In</button>
                    <button type="button" class="btn btn-signup" onclick="window.location.href='signup.html'">Register</button>
                </div>
            </form>

            <hr>

            <a href="login.php" style="text-decoration: none;">
                <button class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo" style="width: 20px;">
                    Continue with Google
                </button>
            </a>
            
            <div class="register-link" style="margin-top: 25px;">
                &#8592; <a href="index.php">Back to Home</a>
            </div>
            
            <p style="font-size: 12px; margin-top:20px; color:#9ca3af; text-align:center;">Use Google OAuth via login.php for full functionality.</p>

            <script src="donation.js"></script>
        </div>
    </div>
</div>

</body>
</html>
