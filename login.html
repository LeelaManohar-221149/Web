<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-in-out;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #bbf0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .data {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0 20px 0;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(187, 240, 255, 0.5);
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .btn-login {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
        }
        .btn-login:hover {
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-signup {
            background: transparent;
            border: 2px solid #00c6ff;
            color: #00c6ff;
        }
        .btn-signup:hover {
            background: #00c6ff;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: #333;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-google:hover {
            background: #eee;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }

        .btn-google img {
            width: 20px;
        }

        a {
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .divider span {
            padding: 0 10px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        .note {
            text-align: center;
            font-size: 12px;
            margin-top: 25px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>LOGIN IN</h2>
        <form class="data" action="lab2.html" target="_self" method="get">
            Username:<br>
            <input type="text" name="username" id="username" placeholder="Enter Username"><br>
            
            Password:<br>
            <input type="password" name="password" id="password" placeholder="Enter Password"><br>
            
            <div class="btn-group">
                <button type="button" class="action-btn btn-login" onclick="loginpage()">Login IN</button>
                <button type="button" class="action-btn btn-signup" onclick="signup()">SIGN UP</button>
            </div>
            
            <div class="divider"><span>OR</span></div>
            
            <a href="login.php" style="text-decoration: none;">
                <button type="button" class="btn-google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
                    Login with Google
                </button>
            </a>

            <div class="note">
                <b>Note:</b> If u Forgot Password, Please Sign Up again !..
            </div>
        </form>
        <script src="donation.js"></script>
    </div>

</body>
</html>
